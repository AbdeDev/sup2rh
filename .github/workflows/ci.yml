# =============================================================================
# CI — Lint, Typecheck, Build
# Déclenché sur chaque PR vers main/dev et push sur main/dev
# Auto-tag sémantique sur push → main (feat→minor, fix→patch, breaking→major)
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (Bun) ──
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build Web
        run: bun run build:web

      - name: Build Admin
        run: bun run build:admin

      - name: Build Landing
        run: bun run build:landing

  # ── Backend (PHP / Symfony) ──
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, opcache
          tools: composer:v2

      - name: Validate composer
        run: composer validate

      - name: Setup env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint YAML config
        run: php bin/console lint:yaml config --env=dev

      - name: Lint container
        run: php bin/console lint:container --env=dev

      - name: PHPUnit
        run: |
          if [ -d tests ] && [ "$(find tests -name '*Test.php' | head -1)" ]; then
            vendor/bin/phpunit
          else
            echo "No tests found, skipping"
          fi

  # ── Auto-tag sémantique (uniquement sur push → main) ──
  auto-tag:
    name: Auto Tag (semver)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: semver
        run: |
          # Récupère le dernier tag vX.Y.Z
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v0.0.0")
          echo "Dernier tag : $LAST_TAG"

          # Parse major.minor.patch
          VERSION="${LAST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Analyse les commits depuis le dernier tag
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          if echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.+\))?!:|BREAKING[[:space:]]CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
            BUMP="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP="patch"
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Nouveau tag : $NEW_TAG (bump: $BUMP)"

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.semver.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG [auto-tag]"
          git push origin "$NEW_TAG"
          echo "✅ Tag $NEW_TAG créé et poussé"
