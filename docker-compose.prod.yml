# =============================================================================
# Sup2Rh — Docker Compose (production VPS)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites sur le serveur :
#   - /opt/sup2rh/.env.prod  (copier depuis .env.prod.example et remplir)
#   - docker login ghcr.io
# =============================================================================

services:
  # ── Nginx reverse proxy (TLS + routing) ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - web_dist:/usr/share/nginx/html/web:ro
      - admin_dist:/usr/share/nginx/html/admin:ro
      - landing_dist:/usr/share/nginx/html/landing:ro
    depends_on:
      - backend
    restart: always

  # ── Backend Symfony API ──
  backend:
    image: ghcr.io/abdedev/sup2rh/backend:${TAG:-latest}
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      RUN_MIGRATIONS: "true"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  web_dist:
  admin_dist:
  landing_dist:
