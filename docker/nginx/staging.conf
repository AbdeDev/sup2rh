# =============================================================================
# Nginx — Configuration STAGING
# http://localhost:8080          → landing page
# http://localhost:8080/web/     → web app
# http://localhost:8080/admin/   → admin app
# http://localhost:8080/api/     → backend Symfony (proxy → backend:80)
# =============================================================================

upstream backend_staging {
    server backend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Headers de sécurité (test en staging, à activer en prod aussi)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → Backend Symfony
    location /api/ {
        proxy_pass http://backend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Admin app (SPA)
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # Web app (SPA)
    location /web {
        alias /usr/share/nginx/html/web;
        try_files $uri $uri/ /web/index.html;
    }

    # Landing (Astro — fichiers statiques)
    location / {
        root /usr/share/nginx/html/landing;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
