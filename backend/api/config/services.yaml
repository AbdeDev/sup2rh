# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration

parameters:
    supabase_project_url: "%env(SUPABASE_PROJECT_URL)%"
    supabase_jwt_aud: "%env(string:SUPABASE_JWT_AUD)%"
    groq_api_key: "%env(default::GROQ_API_KEY)%"
    openrouter_api_key: "%env(default::OPENROUTER_API_KEY)%"
    huggingface_api_key: "%env(default::HUGGINGFACE_API_KEY)%"

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"

    App\Security\SupabaseJwtVerifier:
        arguments:
            $projectUrl: "%supabase_project_url%"
            $audience: "%supabase_jwt_aud%"

    App\Services\AiAnalyzer:
        arguments:
            $groqApiKey: "%groq_api_key%"
            $openRouterApiKey: "%openrouter_api_key%"
            $huggingFaceApiKey: "%huggingface_api_key%"

    App\Services\AdminTokenService:
        arguments:
            $secret: "%env(APP_SECRET)%"
