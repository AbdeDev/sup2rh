nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin: ["http://localhost:5173", "http://localhost:5175"]
        allow_headers: ["Content-Type", "Authorization"]
        expose_headers: ["Content-Type"]
        allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        max_age: 3600
    paths:
        "^/api/":
            origin_regex: false
            allow_origin: ["http://localhost:5173", "http://localhost:5175"]
            allow_headers: ["Content-Type", "Authorization"]
            allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allow_credentials: true
